<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artist - Sanaa</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia,serif;background:#fff8ee;color:#2b1b12}
  .top{padding:12px 16px;background:#c8501e}
  .top a{color:#fff8ee;text-decoration:none;font-size:1.1rem}
  .hero{text-align:center;padding:30px 20px 10px;max-width:600px;margin:auto}
  .avatar{width:100px;height:100px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;color:#fff;background:#c8501e}
  h1{margin:0;font-size:1.8rem}
  .city{color:#7a6556;margin:4px 0 12px}
  .hire{display:inline-block;margin-top:16px;padding:14px 28px;background:#25a244;color:#fff;border-radius:30px;text-decoration:none;font-size:1.05rem}
  h2{max-width:900px;margin:30px auto 10px;padding:0 16px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px 40px;max-width:900px;margin:auto}
  @media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .pic{width:100%;height:150px;object-fit:cover;display:block;background:#eadfce}
  .info{padding:10px}
  .info b{display:block}
  .info small{color:#7a6556}
  .empty{text-align:center;padding:60px 20px}
</style>
</head>
<body>
<div class="top"><a href="index.html">&larr; Sanaa</a></div>
<div id="page"><div class="empty">Loading...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const page = document.getElementById("page");
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  async function load(){
    const id = new URLSearchParams(location.search).get("id");
    const p = id ? (await db.from("profiles").select("*").eq("id", id).maybeSingle()).data : null;
    if(!p){
      page.innerHTML = '<div class="empty">Artist not found. <a href="index.html">Back to gallery</a></div>';
      return;
    }
    const works = (await db.from("artworks").select("*").eq("artist_id", id).order("created_at", {ascending:false})).data || [];
    document.title = p.name + " - Sanaa";

    let hire = "";
    if(p.whatsapp){
      const msg = encodeURIComponent("Hi " + p.name + ", I found you on Sanaa and I'd like to talk about your art.");
      hire = `<a class="hire" href="https://wa.me/${esc(p.whatsapp)}?text=${msg}">Hire me on WhatsApp</a>`;
    }

    page.innerHTML = `
      <div class="hero">
        <div class="avatar">${esc(p.name[0])}</div>
        <h1>${esc(p.name)}</h1>
        <div class="city">${esc(p.city)}</div>
        <p>${esc(p.bio)}</p>
        ${hire}
      </div>
      <h2>Artworks (${works.length})</h2>
      <div class="grid">
        ${works.map(x => `<div class="card">
          <img class="pic" src="${esc(x.image_url)}" alt="${esc(x.title)}" loading="lazy">
          <div class="info"><b>${esc(x.title)}</b><small>${esc(x.category)}</small></div>
        </div>`).join("")}
      </div>`;
  }
  load();
</script>
</body>
</html>
