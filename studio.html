<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Studio - Sanaa</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia,serif;background:#fff8ee;color:#2b1b12}
  .top{padding:12px 16px;background:#c8501e;display:flex;justify-content:space-between;align-items:center}
  .top a{color:#fff8ee;text-decoration:none;font-size:1.1rem}
  .top button{background:none;border:2px solid #fff8ee;color:#fff8ee;border-radius:20px;padding:6px 14px}
  main{max-width:600px;margin:auto;padding:0 16px 40px}
  input,select,textarea{width:100%;padding:12px 16px;margin:6px 0;border:2px solid #2b1b12;border-radius:12px;font-size:1rem;background:#fff;font-family:inherit}
  form button{width:100%;padding:14px;margin-top:8px;border:0;border-radius:30px;font-size:1rem;background:#2b1b12;color:#fff8ee}
  #msg{min-height:22px;font-weight:bold}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .card img{width:100%;height:150px;object-fit:cover;display:block}
  .info{padding:10px}
  .info b{display:block}
  .info small{color:#7a6556}
  .del{margin-top:8px;padding:6px 12px;border:1px solid #b00020;color:#b00020;background:none;border-radius:16px}
</style>
</head>
<body>
<div class="top"><a href="index.html">&larr; Sanaa</a><button id="out">Log out</button></div>
<main>
  <h2>My profile</h2>
  <form id="pf">
    <input id="name" placeholder="Your artist name" required>
    <input id="city" placeholder="City, Country">
    <textarea id="bio" rows="3" placeholder="Short bio"></textarea>
   <input id="wa" inputmode="numeric" placeholder="WhatsApp number (optional) e.g. 256700123456">
<small>Optional. If you add it, buyers will see a "Hire me" button on your page. Leave it empty to keep your number private.</small>
    <button>Save profile</button>
  </form>

  <h2>Add artwork</h2>
  <form id="af">
    <input id="title" placeholder="Artwork title" required>
    <select id="cat">
      <option>Painting</option><option>Digital</option>
      <option>Photography</option><option>Sculpture</option>
    </select>
    <input id="file" type="file" accept="image/*" required>
    <button>Upload</button>
  </form>
  <p id="msg"></p>

  <h2>My artworks</h2>
  <div class="grid" id="mine"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  let uid = null, hasProfile = false;
  const $ = id => document.getElementById(id);
  function say(t, bad){ const m=$("msg"); m.textContent=t; m.style.color = bad ? "#b00020" : "#2b7a3d"; }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  async function init(){
    const r = await db.auth.getSession();
    if(!r.data.session){ location.href = "login.html"; return; }
    uid = r.data.session.user.id;
    const p = (await db.from("profiles").select("*").eq("id", uid).maybeSingle()).data;
    if(p){
      hasProfile = true;
      $("name").value = p.name || ""; $("city").value = p.city || "";
      $("bio").value = p.bio || ""; $("wa").value = p.whatsapp || "";
    }
    loadMine();
  }

  $("pf").onsubmit = async e => {
    e.preventDefault();
    const row = {id:uid, name:$("name").value.trim(), city:$("city").value.trim(),
                 bio:$("bio").value.trim(), whatsapp:$("wa").value.replace(/\D/g,"")};
    const r = await db.from("profiles").upsert(row);
    if(r.error) return say(r.error.message, true);
    hasProfile = true; say("Profile saved.");
  };

  // Shrinks photos to max 1200px so they load fast and save storage
  function shrink(file){
    return new Promise((ok, no) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const s = Math.min(1, 1200 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? ok(b) : no(new Error("Could not read image")), "image/jpeg", 0.8);
      };
      img.onerror = () => no(new Error("That file is not a valid image"));
      img.src = url;
    });
  }

  $("af").onsubmit = async e => {
    e.preventDefault();
    if(!hasProfile) return say("Save your profile first.", true);
    const f = $("file").files[0]; if(!f) return;
    say("Uploading...");
    try{
      const blob = await shrink(f);
      const path = uid + "/" + Date.now() + ".jpg";
      const up = await db.storage.from("artworks").upload(path, blob, {contentType:"image/jpeg"});
      if(up.error) throw up.error;
      const url = db.storage.from("artworks").getPublicUrl(path).data.publicUrl;
      const ins = await db.from("artworks").insert({artist_id:uid, title:$("title").value.trim(), category:$("cat").value, image_url:url});
      if(ins.error) throw ins.error;
      $("af").reset(); say("Artwork uploaded!"); loadMine();
    }catch(err){ say(err.message, true); }
  };

  async function loadMine(){
    const r = await db.from("artworks").select("*").eq("artist_id", uid).order("created_at", {ascending:false});
    if(r.error) return say(r.error.message, true);
    $("mine").innerHTML = r.data.length
      ? r.data.map(a => `<div class="card"><img src="${esc(a.image_url)}" alt="">
          <div class="info"><b>${esc(a.title)}</b><small>${esc(a.category)}</small><br>
          <button class="del" data-id="${a.id}">Delete</button></div></div>`).join("")
      : "<p>No artworks yet.</p>";
  }

  $("mine").onclick = async e => {
    const id = e.target.dataset.id; if(!id) return;
    if(!confirm("Delete this artwork?")) return;
    const r = await db.from("artworks").delete().eq("id", id);
    if(r.error) return say(r.error.message, true);
    loadMine();
  };

  $("out").onclick = async () => { await db.auth.signOut(); location.href = "login.html"; };
  init();
</script>
</body>
</html>
